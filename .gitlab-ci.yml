# GitLab Pages — deploys index.html to the static site on every push to main

stages:
  - deploy

pages:
  stage: deploy
  image: busybox:latest
  script:
    - mkdir -p public
    - cp index.html public/index.html
    - mkdir -p public/data
    - "[ -f data/state.json ] && cp data/state.json public/data/state.json || true"
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
