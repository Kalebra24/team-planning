# GitLab Pages — deploys index.html on every push to main

stages:
  - deploy

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html public/index.html
    - mkdir -p public/data
    - cp data/state.json public/data/state.json 2>/dev/null || true
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
