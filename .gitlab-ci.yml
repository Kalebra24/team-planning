# GitLab Pages — deploys index.html on every push to main
# Runner: Windows PowerShell shell executor

stages:
  - deploy

pages:
  stage: deploy
  script:
    - New-Item -ItemType Directory -Force -Path public | Out-Null
    - Copy-Item index.html public\index.html
    - if (Test-Path manifest.json) { Copy-Item manifest.json public\manifest.json }
    - Copy-Item -Recurse css public\css
    - Copy-Item -Recurse js  public\js
    - Write-Host "Contents of public/"; Get-ChildItem public -Recurse
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
