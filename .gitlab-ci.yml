# GitLab Pages — deploys index.html on every push to main
# Runner: Windows PowerShell shell executor

stages:
  - deploy

pages:
  stage: deploy
  script:
    - New-Item -ItemType Directory -Force -Path public | Out-Null
    - Copy-Item index.html public\index.html
    - New-Item -ItemType Directory -Force -Path public\data | Out-Null
    - if (Test-Path data\state.json) { Copy-Item data\state.json public\data\state.json }
    - Write-Host "Contents of public/"; Get-ChildItem public -Recurse
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
